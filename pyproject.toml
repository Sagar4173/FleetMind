[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetmind"
version = "1.0.0"
description = "Deterministic synthetic logistics data engineering and delivery planning platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "FleetMind Engineering" }]
dependencies = [
  "duckdb>=1.4,<2.1",
  "Faker>=37,<41",
  "numpy>=2.0,<2.4",
  "ortools>=9.15,<9.16",
  "pandas>=2.2,<2.4",
  "plotly>=6,<7",
  "psutil>=7,<8",
  "pyarrow>=23.0.1,<24",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "rich>=13,<16",
  "streamlit>=1.49,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
fleetmind = "fleetmind.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleetmind = ["persistence/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "slow: end-to-end and benchmark tests",
  "integration: integration tests",
]

[tool.coverage.run]
source = ["fleetmind"]
branch = true
